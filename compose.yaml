name: espaco-sinapse
services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sinapse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Configure DB_ADMIN_PASSWORD in .env}
      SINAPSE_DB_USER: ${DB_USERNAME:-sinapse}
      SINAPSE_DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql
      - ./docker/init-database.sh:/docker-entrypoint-initdb.d/10-application-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DB_URL: jdbc:postgresql://database:5432/sinapse
      DB_USERNAME: ${DB_USERNAME:-sinapse}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD in .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Configure BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrador}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Configure BOOTSTRAP_ADMIN_PASSWORD}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend
volumes:
  database:
